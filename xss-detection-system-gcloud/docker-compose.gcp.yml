version: "3"

services:

  # ---------------------------------------------------------
  # 1) Public Gateway (FastAPI) – sends payloads to ML API and ModSecurity
  # ---------------------------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - ML_API_URL=http://ml_api:8080/analyze
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=SecureGCPPassword123!
      - NORMALIZER_URL=http://normalizer:9000/log
    depends_on:
      - ml_api
      - modsecurity
      - normalizer
      - neo4j
      - bwapp
    networks:
      - xss_network
    restart: always
    mem_limit: 512m
    cpus: 0.5



  # ---------------------------------------------------------
  # 2) BWAPP (Target Application)
  # ---------------------------------------------------------
  bwapp:
    image: raesene/bwapp
    container_name: bwapp
    networks:
      - xss_network
    restart: always
    mem_limit: 256m
    cpus: 0.3



  # ---------------------------------------------------------
  # 3) ModSecurity WAF (front of BWAPP)
  # ---------------------------------------------------------
  modsecurity:
    build:
      context: ./modsecurity
      dockerfile: Dockerfile
    container_name: modsecurity
    depends_on:
      - bwapp
    networks:
      - xss_network
    restart: always
    mem_limit: 512m
    cpus: 0.5



  # ---------------------------------------------------------
  # 4) ML API – uses model trained by trainer container
  # ---------------------------------------------------------
  ml_api:
    build:
      context: ./ml_api
      dockerfile: Dockerfile
    container_name: ml_api
    ports:
      - "8080:8080"
    environment:
      - MODEL_PATH=../models/xgb_model.joblib
      - SCALER_PATH=../models/xss_scaler.joblib
    volumes:
      - ../models:/models
    depends_on:
      - neo4j
    networks:
      - xss_network
    restart: always
    mem_limit: 1.5g
    cpus: 1.0



  # ---------------------------------------------------------
  # 5) Neo4j (Graph DB) – logs stored here by normalizer & used in ML training
  # ---------------------------------------------------------
  neo4j:
    image: neo4j:5.13.0
    container_name: neo4j
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "SecureGCPPassword123!", "RETURN 1;"]
      interval: 10s
      timeout: 10s
      retries: 5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/SecureGCPPassword123!
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1g
      - NEO4J_dbms_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - xss_network
    restart: always
    mem_limit: 2g
    cpus: 0.7



  # ---------------------------------------------------------
  # 6) Normalizer – sidecar that converts logs → Neo4j
  # ---------------------------------------------------------
  normalizer:
    build:
      context: ./normalizer
      dockerfile: Dockerfile
    container_name: normalizer
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - PORT=9000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=SecureGCPPassword123!
    ports:
      - "9000:9000"
    networks:
      - xss_network
    restart: always
    mem_limit: 256m
    cpus: 0.3



  # ---------------------------------------------------------
  # 7) Trainer – Offline ML Training Container
  # ---------------------------------------------------------
  trainer:
    build:
      context: ./ml_trainer
      dockerfile: Dockerfile
    container_name: trainer
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=SecureGCPPassword123!
    volumes:
      - ./models:/models              # outputs trained model
      - ./ml-trainer/datasets:/datasets          
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - xss_network
    restart: no  # only run when needed
    mem_limit: 2g
    cpus: 1.0

networks:
  xss_network:
    driver: bridge

volumes:
  models:
    driver: local
  datasets:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

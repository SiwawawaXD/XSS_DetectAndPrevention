input {
  # Read ModSecurity audit logs
  file {
    path => "/logs/modsec_audit.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => multiline {
      pattern => "^--[a-z0-9]+-A--$"
      negate => true
      what => "previous"
    }
    tags => ["modsecurity"]
  }
  
  # Read application logs
  file {
    path => "/logs/xss_detection.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
    tags => ["ml_detection"]
  }
  
  # TCP input for real-time logs
  tcp {
    port => 5000
    codec => json
    tags => ["realtime"]
  }
}

filter {
  if "modsecurity" in [tags] {
    # Parse ModSecurity audit log format
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp}.*id \"(?<rule_id>\d+)\".*msg \"(?<message_text>[^\"]*)\".*severity \"(?<severity>[^\"]*)\"" 
      }
    }
    
    # Extract XSS-related information
    grok {
      match => { 
        "message" => "Matched Data: (?<matched_data>[^\n]*)" 
      }
    }
    
    # Add geo IP information if client IP is present
    if [client_ip] {
      geoip {
        source => "client_ip"
        target => "geoip"
      }
    }
    
    mutate {
      add_field => { "detection_method" => "ModSecurity WAF" }
    }
  }
  
  if "ml_detection" in [tags] {
    # Parse ML detection logs
    json {
      source => "message"
    }
    
    mutate {
      add_field => { "detection_method" => "Machine Learning" }
    }
  }
  
  # Common filters for all logs
  date {
    match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss" ]
    target => "@timestamp"
  }
  
  # Categorize threat level
  if [severity] == "CRITICAL" or [impact_level] == "CRITICAL" {
    mutate {
      add_field => { "threat_category" => "critical" }
    }
  } else if [severity] == "HIGH" or [impact_level] == "HIGH" {
    mutate {
      add_field => { "threat_category" => "high" }
    }
  } else if [severity] == "MEDIUM" or [impact_level] == "MEDIUM" {
    mutate {
      add_field => { "threat_category" => "medium" }
    }
  } else {
    mutate {
      add_field => { "threat_category" => "low" }
    }
  }
  
  # Extract attack type if present
  if [xss_type] {
    mutate {
      add_field => { "attack_type" => "%{xss_type}" }
    }
  }
  
  # Anonymize sensitive data (optional)
  if [payload] {
    mutate {
      update => { "payload" => "%{payload}" }
      gsub => [ "payload", "password=[^&]*", "password=***" ]
    }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "xss-detections-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
  
  # Debug output to console
  stdout {
    codec => rubydebug
  }
  
  # Send critical alerts to separate index
  if [threat_category] == "critical" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "xss-alerts-critical-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }
}
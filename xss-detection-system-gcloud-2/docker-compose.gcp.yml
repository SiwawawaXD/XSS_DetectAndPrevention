version: '3.8'

# Simplified Configuration - Neo4j only for logging
# Removed Elasticsearch, Kibana, and Logstash

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/logs
    environment:
      - FLASK_ENV=production
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=SecureGCPPassword123!
    depends_on:
      - modsecurity
      - xss_detection_api
      - bwapp
      - neo4j
    networks:
      - xss_network
    restart: always
    mem_limit: 512m
    cpus: 0.5

  bwapp:
    image: raesene/bwapp
    container_name: bwapp
    networks:
      - xss_network
    restart: always
    mem_limit: 256m
    cpus: 0.3

  modsecurity:
    build:
      context: ./modsecurity
      dockerfile: Dockerfile
    container_name: modsecurity
    volumes:
      - ./logs:/var/log/apache2
    depends_on:
      - bwapp
    networks:
      - xss_network
    restart: always
    mem_limit: 512m
    cpus: 0.5

  xss_detection_api:
    build:
      context: ./ml_api
      dockerfile: Dockerfile
    container_name: xss_detection_api
    ports:
      - "5001:5001"
    volumes:
      - ./logs:/logs
      - ./models:/models
      - ./training_data:/training_data
    environment:
      - FLASK_ENV=production
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=SecureGCPPassword123!
    depends_on:
      - neo4j
    networks:
      - xss_network
    restart: always
    mem_limit: 2g
    cpus: 1.5

  neo4j:
    image: neo4j:5.13.0
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/SecureGCPPassword123!
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2g
      - NEO4J_dbms_memory_pagecache_size=1g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - xss_network
    restart: always
    mem_limit: 3g
    cpus: 1.0

networks:
  xss_network:
    driver: bridge

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local